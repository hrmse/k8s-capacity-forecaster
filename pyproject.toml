[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-capacity-forecaster"
version = "0.1.0"
description = "Conservative Kubernetes workload capacity recommendation engine"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/capacity_forecaster"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
