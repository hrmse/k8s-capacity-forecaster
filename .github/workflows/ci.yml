name: Validate capacity forecaster

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest ruff
      - run: ruff check src tests
      - run: python -m pytest
      - name: Exercise example report generation
        run: python -m capacity_forecaster.cli --input examples/workload-snapshot.json --report /tmp/report.json --metrics /tmp/metrics.prom
